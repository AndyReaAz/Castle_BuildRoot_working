# The Application owns the live model/serial hostname. NetworkManager must
# not replace it later with the immutable Buildroot fallback from /etc/hostname.
[main]
hostname-mode=none

# usb0 is owned by the NextGen USB gadget control script, not NetworkManager.
[keyfile]
unmanaged-devices=interface-name:usb0

# WILC3000 fully tears its firmware down whenever wlan0 is closed.  NetworkManager
# randomises the Wi-Fi MAC address for scans by default, which requires down/up
# transitions on this driver and causes repeated firmware load/deinitialise
# cycles before association.  Keep the hardware MAC unchanged while scanning.
[device-wlan0]
match-device=interface-name:wlan0
wifi.scan-rand-mac-address=no

# Always present the instrument hostname (model + serial) to the upstream
# DHCP server. The Application owns the live kernel hostname; immutable
# /etc/hostname remains only the early-boot fallback.
[connection-wlan0]
match-device=interface-name:wlan0
ipv4.dhcp-send-hostname=1
