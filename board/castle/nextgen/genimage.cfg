# Transitional full SD-boot image.
#
# Current SD boot expects:
#   p1: FAT boot partition mounted at /boot
#   p2: ext4 root filesystem mounted at /
#   p3: ext4 meter data mounted at /sdcard
#
# The future production installer will instead provision NOR/MTD + UBI/UBIFS
# and the SD card can then become data-only.

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0x0c
        bootable = "true"
        image = "boot.vfat"
        offset = 1M
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext4"
    }

    partition data {
        partition-type = 0x83
        image = "data.ext4"
    }
}
